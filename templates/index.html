
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AI Assistant</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #020914;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px 30px;
    font-size: 26px;
    font-weight: bold;
    color: #00d9ff;
    border-bottom: 1px solid #087ca5;
    text-shadow: 0 0 15px #00aaff;
}

.container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 20px;
    min-height: calc(100vh - 75px);
}

.avatar-panel,
.chat-panel {
    background: #061522;
    border: 1px solid #087ca5;
    border-radius: 20px;
    box-shadow: 0 0 20px #003e62;
    overflow: hidden;
}

.avatar-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    min-height: 650px;
}

.avatar {
    width: 100%;
    max-width: 520px;
    height: 540px;
    object-fit: cover;
    object-position: center top;
    border-radius: 18px;
    border: 2px solid #00cfff;
    box-shadow: 0 0 25px #008cff;
    transition: 0.3s;
}

/* Avatar speaking animation */
.avatar.speaking {
    animation: avatarSpeaking 0.7s infinite alternate;
}

@keyframes avatarSpeaking {
    from {
        filter: brightness(1);
        transform: scale(1);
        box-shadow: 0 0 15px #008cff;
    }

    to {
        filter: brightness(1.3);
        transform: scale(1.015);
        box-shadow: 0 0 40px #00d9ff;
    }
}

h2 {
    color: #00d9ff;
}

.status {
    color: #00ff88;
    margin-top: 10px;
    font-size: 17px;
}

.speaking {
    color: #00ffcc;
    text-align: center;
    padding: 10px;
}

.chat-panel {
    display: flex;
    flex-direction: column;
    padding: 20px;
    min-height: 650px;
}

#messages {
    flex: 1;
    overflow-y: auto;
    min-height: 350px;
    max-height: 65vh;
}

.message {
    background: #10283a;
    padding: 15px;
    border-radius: 12px;
    margin: 12px 0;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    border-left: 3px solid #00d9ff;
}

.bot {
    border-left: 3px solid #00ff99;
}

.controls {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

input {
    flex: 1;
    min-width: 0;
    padding: 17px;
    border-radius: 12px;
    border: 1px solid #008bb5;
    background: #020b13;
    color: white;
    font-size: 16px;
}

button {
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    background: #00cfff;
    color: #00121c;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #00ffcc;
}

.voice-button {
    background: #073b50;
    color: white;
    border: 1px solid #00cfff;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

@media(max-width: 800px) {
    .container {
        grid-template-columns: 1fr;
    }

    .avatar-panel {
        min-height: 400px;
    }

    .avatar {
        height: 400px;
    }

    .chat-panel {
        min-height: 550px;
    }
}
</style>
</head>

<body>

<header>◈ JARVIS AI ASSISTANT</header>

<div class="container">

    <!-- FEMALE AVATAR -->
    <section class="avatar-panel">

        <img
            class="avatar"
            id="avatar"
            src="{{ url_for('static', filename='robot.png') }}"
            alt="JARVIS Female Avatar"
        >

        <h2>JARVIS</h2>

        <div class="status" id="status">
            ● ONLINE
        </div>

        <div class="speaking" id="speakingText"></div>

    </section>

    <!-- CHAT PANEL -->
    <section class="chat-panel">

        <h2>JARVIS CHAT</h2>

        <div id="messages">

            <div class="message bot">
                JARVIS: Hello! I am your AI assistant.
                How can I help you today?
            </div>

        </div>

        <div class="controls">

            <button
                class="voice-button"
                id="micButton"
                onclick="startListening()">
                🎙
            </button>

            <input
                id="userInput"
                type="text"
                placeholder="Ask JARVIS anything..."
                autocomplete="off"
            >

            <button id="sendButton" onclick="sendMessage()">
                SEND
            </button>

        </div>

        <div class="controls">

            <button class="voice-button" onclick="stopSpeaking()">
                STOP VOICE
            </button>

        </div>

    </section>

</div>

<script>

const input = document.getElementById("userInput");
const messages = document.getElementById("messages");
const statusText = document.getElementById("status");
const speakingText = document.getElementById("speakingText");
const avatar = document.getElementById("avatar");
const sendButton = document.getElementById("sendButton");

let isListening = false;

function addMessage(text, type) {

    const div = document.createElement("div");

    div.className = "message " + type;
    div.textContent = text;

    messages.appendChild(div);

    messages.scrollTop = messages.scrollHeight;

    return div;
}

/* VOICE OUTPUT */

function speak(text) {

    if (!("speechSynthesis" in window)) {
        speakingText.textContent = "Voice is not supported.";
        return;
    }

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = "en-US";
    speech.rate = 0.95;
    speech.pitch = 1;

    speech.onstart = function() {

        speakingText.textContent = "🔊 JARVIS IS SPEAKING";

        avatar.classList.add("speaking");

        statusText.textContent = "● SPEAKING";

    };

    speech.onend = function() {

        speakingText.textContent = "";

        avatar.classList.remove("speaking");

        statusText.textContent = "● ONLINE";

    };

    speech.onerror = function() {

        speakingText.textContent = "Voice playback error.";

        avatar.classList.remove("speaking");

        statusText.textContent = "● ONLINE";

    };

    window.speechSynthesis.speak(speech);

}

/* STOP VOICE */

function stopSpeaking() {

    window.speechSynthesis.cancel();

    avatar.classList.remove("speaking");

    speakingText.textContent = "";

    statusText.textContent = "● ONLINE";

}

/* SEND MESSAGE TO AI */

async function sendMessage() {

    const question = input.value.trim();

    if (!question) return;

    if (sendButton.disabled) return;

    addMessage("YOU: " + question, "user");

    input.value = "";

    const loading = addMessage("JARVIS: Thinking...", "bot");

    statusText.textContent = "● THINKING";

    sendButton.disabled = true;

    try {

        const response = await fetch("/chat", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: question
            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.reply || "Server error");
        }

        let answer = data.reply || "No response received.";

        // Avoid duplicate JARVIS prefix
        answer = answer.replace(/^JARVIS:\s*/i, "").trim();

        loading.textContent = "JARVIS: " + answer;

        statusText.textContent = "● ONLINE";

        speak(answer);

    }

    catch (error) {

        loading.textContent = "JARVIS: " + error.message;

        statusText.textContent = "● CONNECTION ERROR";

    }

    finally {

        sendButton.disabled = false;

        messages.scrollTop = messages.scrollHeight;

    }

}

/* ENTER KEY */

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

/* MICROPHONE INPUT */

function startListening() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert("Speech recognition is not supported. Please use Chrome.");

        return;

    }

    if (isListening) return;

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;

    isListening = true;

    statusText.textContent = "● LISTENING";

    recognition.onresult = function(event) {

        input.value = event.results[0][0].transcript;

        sendMessage();

    };

    recognition.onerror = function(event) {

        console.log("Microphone error:", event.error);

        statusText.textContent = "● MICROPHONE ERROR";

    };

    recognition.onend = function() {

        isListening = false;

        if (statusText.textContent === "● LISTENING") {

            statusText.textContent = "● ONLINE";

        }

    };

    try {

        recognition.start();

    }

    catch(error) {

        isListening = false;

        statusText.textContent = "● ONLINE";

        console.log(error);

    }

}

</script>

</body>
</html>
